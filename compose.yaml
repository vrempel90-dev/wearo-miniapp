services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: wearo
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: wearo_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wearo -d wearo_dev"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
